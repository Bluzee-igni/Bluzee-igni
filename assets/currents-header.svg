<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214" />
      <stop offset="100%" stop-color="#17171a" />
    </linearGradient>

    <!-- Subtle Currents flow curves -->
    <linearGradient id="flowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0" />
      <stop offset="25%" stop-color="#3f3f46" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#c026d3" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#3f3f46" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome metallic sphere gradient -->
    <radialGradient id="chromeMinimal" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e4e4e7" />
      <stop offset="65%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#18181b" />
    </radialGradient>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="150" rx="10" fill="url(#headerBg)" stroke="#27272a" stroke-width="1" />

  <!-- Currents subtle aerodynamic streamline curves (understated, dark) -->
  <g opacity="0.6">
    <path d="M 0 50 Q 180 50, 260 75 T 850 65" stroke="#27272a" stroke-width="1" fill="none" />
    <path d="M 0 60 Q 180 60, 260 75 T 850 72" stroke="url(#flowAccent)" stroke-width="1.2" fill="none" />
    <path d="M 0 70 Q 180 70, 260 75 T 850 78" stroke="url(#flowAccent)" stroke-width="1.5" fill="none" />
    <path d="M 0 80 Q 180 80, 260 75 T 850 84" stroke="url(#flowAccent)" stroke-width="1.2" fill="none" />
    <path d="M 0 90 Q 180 90, 260 75 T 850 92" stroke="#27272a" stroke-width="1" fill="none" />
    <path d="M 0 100 Q 180 100, 260 75 T 850 100" stroke="#27272a" stroke-width="1" fill="none" />
  </g>

  <!-- Chrome Sphere Accent (Robert Beatty homage) -->
  <g transform="translate(230, 75)">
    <circle cx="0" cy="0" r="18" fill="url(#chromeMinimal)" stroke="#52525b" stroke-width="1" />
    <circle cx="-5" cy="-5" r="4" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Typography: Centered & Sharp -->
  <text x="520" y="65" text-anchor="middle" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="22" letter-spacing="2.5">ATHA FAKHRI ARKANA</text>
  
  <text x="520" y="92" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="12.5" letter-spacing="1">BACKEND ARCHITECTURE  •  LINUX &amp; SYSTEMS ADMINISTRATION</text>

  <text x="520" y="114" text-anchor="middle" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-style="italic" font-weight="400" font-size="10.5" letter-spacing="1.5">LET IT HAPPEN // SMARTER FLOW, STRONGER SYSTEMS</text>
</svg>
