<svg width="850" height="36" viewBox="0 0 850 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background glow & fade -->
    <linearGradient id="fadeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0718" stop-opacity="0" />
      <stop offset="15%" stop-color="#ff7b00" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ff2a70" stop-opacity="1" />
      <stop offset="50%" stop-color="#e0247c" stop-opacity="1" />
      <stop offset="65%" stop-color="#9d4edd" stop-opacity="1" />
      <stop offset="85%" stop-color="#5a189a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d0718" stop-opacity="0" />
    </linearGradient>

    <!-- Secondary line gradient -->
    <linearGradient id="subtleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="5%" stop-color="#ff7b00" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff477e" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#c77dff" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#7b2cbf" stop-opacity="0.4" />
      <stop offset="95%" stop-color="#3c096c" stop-opacity="0" />
    </linearGradient>

    <!-- Chrome metallic sphere gradient -->
    <radialGradient id="chromeBall" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f1f5f9" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="90%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Outer glow for sphere -->
    <filter id="sphereGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .flow-wave {
      animation: waveShift 8s ease-in-out infinite alternate;
    }
    @keyframes waveShift {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(1.2) translateY(-1px); }
    }
  </style>

  <!-- Ambient backdrop soft line -->
  <line x1="30" y1="18" x2="820" y2="18" stroke="url(#subtleGradient)" stroke-width="1" stroke-dasharray="2 4" opacity="0.3" />

  <!-- Outer streamline 1 -->
  <path d="M 50 18 Q 250 8, 415 18 T 800 18" stroke="url(#subtleGradient)" stroke-width="1.2" fill="none" opacity="0.6" />
  
  <!-- Outer streamline 2 -->
  <path d="M 70 18 Q 280 28, 415 18 T 780 18" stroke="url(#subtleGradient)" stroke-width="1.2" fill="none" opacity="0.6" />

  <!-- Main Currents streamlined flow line (flowing into and around center) -->
  <path class="flow-wave" d="M 20 18 C 180 18, 300 24, 395 24 C 412 24, 420 18, 425 18 C 430 18, 438 24, 455 24 C 550 24, 670 18, 830 18" stroke="url(#fadeEdge)" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <path class="flow-wave" d="M 20 18 C 180 18, 300 12, 395 12 C 412 12, 420 18, 425 18 C 430 18, 438 12, 455 12 C 550 12, 670 18, 830 18" stroke="url(#fadeEdge)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Center Chrome Sphere - Tame Impala Signature Element -->
  <g transform="translate(425, 18)">
    <!-- Atmospheric sphere halo -->
    <circle cx="0" cy="0" r="10" fill="#e0247c" opacity="0.25" filter="url(#sphereGlow)" />
    <circle cx="0" cy="0" r="7" fill="url(#chromeBall)" stroke="#ff2a70" stroke-width="0.8" />
    <circle cx="-2" cy="-2" r="2.2" fill="#ffffff" opacity="0.8" />
    <circle cx="1.5" cy="1.5" r="1" fill="#c084fc" opacity="0.6" />
  </g>
</svg>
