<svg width="680" height="152" viewBox="0 0 680 152" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e061a" />
      <stop offset="50%" stop-color="#140926" />
      <stop offset="100%" stop-color="#0a0413" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ff2a70" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.5" />
    </linearGradient>

    <!-- Progress Fill Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="40%" stop-color="#ff2a70" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Album Sphere Gradient -->
    <radialGradient id="miniChrome" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </radialGradient>

    <!-- Equalizer Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2a70" />
      <stop offset="60%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ff9e00" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="albumClip">
      <rect x="22" y="22" width="108" height="108" rx="10" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes barWave1 { 0%, 100% { height: 6px; y: 22px; } 50% { height: 26px; y: 2px; } }
    @keyframes barWave2 { 0%, 100% { height: 18px; y: 10px; } 50% { height: 8px; y: 20px; } }
    @keyframes barWave3 { 0%, 100% { height: 10px; y: 18px; } 50% { height: 28px; y: 0px; } }
    @keyframes barWave4 { 0%, 100% { height: 24px; y: 4px; } 50% { height: 12px; y: 16px; } }
    @keyframes barWave5 { 0%, 100% { height: 14px; y: 14px; } 50% { height: 26px; y: 2px; } }

    .pulse-dot {
      transform-origin: 152px 34px;
      animation: pulseDot 2s ease-in-out infinite;
    }
    .eq-1 { animation: barWave1 1.1s ease-in-out infinite; }
    .eq-2 { animation: barWave2 0.9s ease-in-out infinite 0.2s; }
    .eq-3 { animation: barWave3 1.3s ease-in-out infinite 0.1s; }
    .eq-4 { animation: barWave4 0.8s ease-in-out infinite 0.3s; }
    .eq-5 { animation: barWave5 1.0s ease-in-out infinite 0.15s; }
    .eq-6 { animation: barWave2 1.2s ease-in-out infinite 0.35s; }
    .eq-7 { animation: barWave4 0.95s ease-in-out infinite 0.25s; }
    .eq-8 { animation: barWave1 1.15s ease-in-out infinite 0.05s; }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="678" height="150" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background decorative aerodynamic streamline curves -->
  <path d="M 0 50 Q 200 40, 350 70 T 680 60" stroke="#ff2a70" stroke-width="0.8" opacity="0.15" fill="none" />
  <path d="M 0 85 Q 250 95, 450 75 T 680 90" stroke="#a855f7" stroke-width="0.8" opacity="0.15" fill="none" />
  <path d="M 0 120 Q 300 130, 500 110 T 680 115" stroke="#ff7b00" stroke-width="0.8" opacity="0.12" fill="none" />

  <!-- ================= ALBUM ART SECTION ================= -->
  <g clip-path="url(#albumClip)">
    <!-- Album base -->
    <rect x="22" y="22" width="108" height="108" fill="#130924" />
    
    <!-- Currents album streamlines -->
    <path d="M 15 45 Q 60 45, 75 76 T 135 76" stroke="#ff7b00" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 15 55 Q 60 55, 75 76 T 135 76" stroke="#ff2a70" stroke-width="2" fill="none" opacity="0.9" />
    <path d="M 15 65 Q 60 65, 75 76 T 135 76" stroke="#e0247c" stroke-width="2.2" fill="none" />
    <path d="M 15 75 Q 60 75, 75 76 T 135 76" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.9" />
    <path d="M 15 85 Q 60 85, 75 76 T 135 76" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M 15 95 Q 60 95, 75 76 T 135 76" stroke="#3b0764" stroke-width="2" fill="none" opacity="0.7" />

    <!-- Chrome Sphere in Album Art -->
    <circle cx="76" cy="76" r="22" fill="url(#miniChrome)" stroke="#ffffff" stroke-width="0.7" filter="url(#glowFilter)" />
    <circle cx="70" cy="70" r="6" fill="#ffffff" opacity="0.7" />
  </g>
  <rect x="22" y="22" width="108" height="108" rx="10" stroke="url(#borderGrad)" stroke-width="1.2" fill="none" />

  <!-- ================= TRACK INFO ================= -->
  <!-- Status Badge -->
  <g transform="translate(145, 23)">
    <!-- Pulsing red/magenta dot -->
    <circle class="pulse-dot" cx="7" cy="11" r="4.5" fill="#ff2a70" />
    <circle cx="7" cy="11" r="2" fill="#ffffff" />
    <text x="18" y="14" fill="#ff7b00" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="10" letter-spacing="1.2">NOW STREAMING • ROTATION</text>
  </g>

  <!-- Track Title -->
  <text x="145" y="58" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="800" font-size="18" letter-spacing="0.3">Let It Happen</text>

  <!-- Artist & Album -->
  <text x="145" y="75" fill="#c084fc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="12">Tame Impala <tspan fill="#64748b">•</tspan> Currents <tspan fill="#64748b">(2015)</tspan></text>

  <!-- ================= AUDIO EQUALIZER (TOP RIGHT) ================= -->
  <g transform="translate(565, 30)">
    <!-- Pill container -->
    <rect x="-10" y="-8" width="108" height="42" rx="21" fill="#180b2f" stroke="#ff2a70" stroke-width="0.8" stroke-opacity="0.5" />
    <rect class="eq-1" x="5" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-2" x="12" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-3" x="19" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-4" x="26" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-5" x="33" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-6" x="40" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-7" x="47" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-8" x="54" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-3" x="61" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-5" x="68" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
    <rect class="eq-2" x="75" y="6" width="3.5" height="18" rx="1.5" fill="url(#eqGrad)" />
  </g>

  <!-- ================= PROGRESS BAR (LET IT HAPPEN GLITCH DROP 4:16) ================= -->
  <g transform="translate(145, 96)">
    <!-- Track duration: 7:48 (468 sec), Current: 4:16 (256 sec) -> 54.7% -->
    <!-- Background track (width: 380px) -->
    <rect x="0" y="0" width="380" height="5" rx="2.5" fill="#2d164d" />
    
    <!-- Active progress track (54.7% of 380 = 208px) -->
    <rect x="0" y="0" width="208" height="5" rx="2.5" fill="url(#progressGrad)" />
    
    <!-- Scrubber handle with glow -->
    <circle cx="208" cy="2.5" r="5" fill="#ffffff" stroke="#ff2a70" stroke-width="2" filter="url(#glowFilter)" />
    
    <!-- Time stamps -->
    <text x="0" y="18" fill="#e2e8f0" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="600">04:16 <tspan fill="#ff2a70" font-size="9">(The Loop)</tspan></text>
    <text x="380" y="18" text-anchor="end" fill="#94a3b8" font-family="'Segoe UI', monospace" font-size="10.5">07:48</text>
  </g>

  <!-- ================= CONTROLS & LYRIC ================= -->
  <!-- Lyric quote -->
  <text x="145" y="132" fill="#f472b6" font-style="italic" font-family="'Segoe UI', sans-serif" font-size="11" opacity="0.9">"It's gonna feel so good, just let it happen..."</text>

  <!-- Playback buttons (Right bottom) -->
  <g transform="translate(560, 110)">
    <!-- Previous -->
    <path d="M 0 10 L 0 2 M 1 6 L 8 2 L 8 10 Z" fill="#94a3b8" stroke="#94a3b8" stroke-width="0.8" />
    
    <!-- Pause Button (Currents circle button) -->
    <circle cx="26" cy="6" r="13" fill="#ff2a70" />
    <rect x="22" y="1" width="3" height="10" rx="1" fill="#ffffff" />
    <rect x="27" y="1" width="3" height="10" rx="1" fill="#ffffff" />
    
    <!-- Next -->
    <path d="M 52 10 L 52 2 M 51 6 L 44 2 L 44 10 Z" fill="#94a3b8" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Loop Icon -->
    <path d="M 68 3 L 73 3 C 76 3, 78 5, 78 7 L 78 8 M 76 1 L 79 3 L 76 5 M 78 9 L 73 9 C 70 9, 68 7, 68 5 L 68 4 M 70 11 L 67 9 L 70 7" fill="none" stroke="#e0247c" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
