name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # Jalan otomatis tiap hari (00:00 UTC)
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
  workflow_dispatch:     # Bisa dijalankan manual lewat tab Actions di GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Card GitHub Stats (Tema Dark Matte seperti screenshot)
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Bluzee-igni&bg_color=151515&title_color=ffffff&text_color=9f9f9f&ring_color=ffffff&icon_color=ffffff&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Card Top Languages (Tema Dark Matte seperti screenshot)
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Bluzee-igni&layout=compact&langs_count=6&bg_color=151515&title_color=ffffff&text_color=9f9f9f&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Card Streak Stats (Otomatis disimpan ke profile/streak.svg biar gak pernah rusak)
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Bluzee-igni&theme=dark&hide_border=true&background=151515
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Commit & Push hasil SVG ke folder profile/
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats cards"
          git push
